name: ✨ 功能建议
description: 建议一个新的可视化模块、交互能力或改进
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提建议！如果建议涉及**新的数学模块**，请说明它在"定义 / 几何意义 / 代数操作 / 实际应用"
        四个维度上分别要展示什么——这是本项目的模块契约。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述你遇到的困难或想理解的概念，而不是直接给实现方案。
      placeholder: |
        例如：我很难直观理解"泰勒展开为什么能逼近函数"，
        希望能看到阶数增加时曲线如何贴近原函数。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你期望的方案
      description: 你希望看到什么样的交互与图形？可拖动什么参数？关键结论如何呈现？
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: 所属学段
      options:
        - 小学（算术直观）
        - 初中（代数 / 平面几何 / 统计初步）
        - 高中（函数 / 三角 / 向量 / 圆锥曲线 / 数列 / 概率统计 / 立体几何）
        - 大学（基础微积分）
        - 跨学段 / 工具与交互
    validations:
      required: true

  - type: textarea
    id: closure
    attributes:
      label: 概念闭环（四个维度）
      description: 如果是新模块，请分别说明四个维度要展示的内容。
      value: |
        - 定义：
        - 几何意义：
        - 代数操作：
        - 实际应用：
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法，或已知的同类实现。
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue 与 README 的知识覆盖表，确认这不是已实现的功能
          required: true
